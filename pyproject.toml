[project]
name = "amp_ctmc_2027"
version = "0.1.0"
description = "CTMC AMP generation pipeline aligned to AMP Challenge format"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "biopython>=1.85",
  "numpy>=2.1.0",
  "pydantic>=2.11.0",
  "rapidfuzz>=3.14.0",
  "torch>=2.8.0",
  "tqdm>=4.67.0",
  "wandb>=0.22.0",
  "xgboost>=3.0.0",
]

[project.optional-dependencies]
data = ["pyarrow>=20.0.0", "PyYAML>=6.0.2"]
training = ["transformers>=4.55.0"]

[project.scripts]
train = "amp_ctmc_2027.train:main"
generate = "amp_ctmc_2027.generate:generate_broad_spectrum"
generate_broad_spectrum = "amp_ctmc_2027.generate:generate_broad_spectrum"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_ctmc_2027"]
