[project]
name = "amp_ctmc_2027"
version = "0.1.0"
description = "CTMC AMP generation pipeline aligned to AMP Challenge format"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "biopython==1.88",
  "Levenshtein==0.27.3",
  "numpy==2.4.6",
  "pyarrow>=25.0.1",
  "pydantic==2.13.5",
  "rapidfuzz==3.14.6",
  "torch==2.14.0",
  "tqdm==4.70.0",
  "transformers>=5.17.0",
  "xgboost==3.2.0",
]

[dependency-groups]
data = [
  "pandas==2.3.3",
  "pyarrow==25.0.1",
  "PyYAML==6.0.3",
]
training = [
  "accelerate==1.10.1",
  "huggingface-hub==1.33.0",
  "safetensors==0.8.0",
  "tokenizers==0.23.2",
  "transformers==5.17.0",
  "wandb==0.22.0",
]
dev = ["pytest==9.1.1", "ruff==0.13.2"]

[project.scripts]
train = "amp_ctmc_2027.train:main"
generate = "amp_ctmc_2027.generate:generate_broad_spectrum"
generate_broad_spectrum = "amp_ctmc_2027.generate:generate_broad_spectrum"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_ctmc_2027"]

[tool.ruff.lint]
ignore = ["EXE001"]
